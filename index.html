  .modo input:checked + label { border-color: var(--primaria); background: var(--superficie-alta); box-shadow: inset 0 0 0 1px var(--primaria); }
  .modo input:focus-visible + label { outline: 2px solid var(--primaria); outline-offset: 2px; }

  dialog .corpo { padding: 20px 22px 8px; }

  dialog p { margin: 0; font-size: 14.5px; }

<script>

const app = document.getElementById("app");
const fmtHora = new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" });
const fmtDataHora = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const num1 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
let token = null, janelaMin = 60, dados = null, timer = null, falhas = 0, pedindo = false;

function lerToken() {
  const m = location.hash.match(/[#&]t=([0-9a-f]{32,})/i);
  if (m) { try { localStorage.setItem("aegis_token_painel", m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem("aegis_token_painel"); } catch (e) { return null; }
}

async function rpc(fn, args) {
  const h = { "Content-Type": "application/json", "apikey": CHAVE_PUBLICA };
  if (CHAVE_PUBLICA.startsWith("eyJ")) h["Authorization"] = "Bearer " + CHAVE_PUBLICA;
  const r = await fetch(SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, { method: "POST", headers: h, body: JSON.stringify(args) });
  const txt = await r.text();
  if (!r.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) {} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ha(seg) {
  if (seg == null) return "";
  if (seg < 60) return "há " + seg + " s";
  if (seg < 3600) return "há " + Math.round(seg / 60) + " min";
  if (seg < 86400) return "há " + Math.round(seg / 3600) + " h";
  return "há " + Math.round(seg / 86400) + " dias";
}
function segDesde(iso) { return iso ? Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000)) : null; }

// ---------- Modos de medição (o mesmo nome que o app entende em Nuvem.sensorPedido) ----------
const RESUMO_BRUTO = "Só um resumo no fim: duração, amostras por segundo, perdas e o nome do arquivo. O sinal fica gravado no celular e vai para o Drive pelo Autosync.";
const MODOS = {

    uso: "Sentado, braço apoiado, sem tocar no relógio. Os primeiros 30–40 s são descartados na análise, então prefira 90 s.",

  },

    nome: "PPG", curto: "Só o pulso óptico, 25 Hz", tec: "Modo 1 · 25 amostras por segundo",
    mede: "Só o sinal do sensor óptico, sem acelerômetro. Foi o primeiro modo usado no projeto.",
    uso: "Para análise, prefira o PPG + acelerômetro: é o mesmo pulso e ainda mostra se o braço mexeu.",

  IMU: {

    mede: "O movimento do pulso em 6 eixos (aceleração e rotação), com o horário do próprio relógio em cada amostra.",
    uso: "Serve para postura e repouso. Para marcha e quedas é lento demais: use a IMU rápida.",
    painel: RESUMO_BRUTO, instr: ""
  },
  IMU_RAPIDA: {
    nome: "IMU rápida", curto: "Movimento ~190 Hz · marcha e quedas", tec: "Modo 8 · ~190 amostras por segundo",
    mede: "Os mesmos 6 eixos da IMU, cerca de 8 vezes mais rápido. É o modo pensado para marcha, testes de mobilidade e quedas.",
    uso: "A pessoa pode se mexer normalmente. É normal perder cerca de 3% das amostras, em trechos curtos.",
    painel: RESUMO_BRUTO, instr: "A pessoa pode se mexer normalmente."
  },
  IMU_RAPIDA_V: {
    nome: "IMU rápida + FC", curto: "Movimento ~190 Hz com FC", vivo: true, tec: "Modo 8 + comando 0x64",
    mede: "A IMU rápida e, junto, os sinais vitais do relógio a cada segundo.",
    uso: "A pessoa pode se mexer normalmente. Neste modo o relógio não manda SpO₂, só FC.",
    painel: "A FC aparece no gráfico durante a medição; no fim, o resumo da IMU (amostras por segundo, perdas, arquivo) e a FC mediana.",
    instr: "A pessoa pode se mexer normalmente."
  },
  ECG: {
    nome: "ECG", curto: "Precisa abrir o ECG no relógio", atencao: true, tec: "Modo 6 · ~481 amostras por segundo",
    mede: "Eletrocardiograma de uma derivação, medido entre o pulso e o dedo da outra mão encostado no relógio.",
    uso: "O relógio só começa o ECG quando alguém abre o ECG no menu do próprio relógio e encosta o dedo no sensor. O celular fica pronto para gravar; se ninguém abrir o menu, a medição termina sem dados.",
    painel: RESUMO_BRUTO, instr: "Peça para abrir o ECG no menu do relógio e encostar o dedo."
  },
};
let modo = "VITAIS";

function lerPref(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function gravarPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function montarModos() {
  const salvo = lerPref("aegis_modo");
  if (MODOS[salvo]) modo = salvo;
  document.getElementById("modos").innerHTML = Object.entries(MODOS).map(([id, m]) => `
    <div class="modo">
      <input type="radio" name="modo" id="m_${id}" value="${id}" ${id === modo ? "checked" : ""}>
      <label for="m_${id}"><span class="nome">${m.nome}${m.vivo ? `<span class="vivo">● AO VIVO</span>` : ""}</span>
        <span class="curto${m.atencao ? " atencao" : ""}">${m.curto}</span></label>
      <button class="info" type="button" data-modo="${id}" aria-label="Sobre o modo ${m.nome}" title="Sobre este modo">?</button>
    </div>`).join("");
  document.querySelectorAll('#modos input').forEach(r => r.onchange = () => escolherModo(r.value));
  document.querySelectorAll('#modos .info').forEach(b => b.onclick = () => abrirModo(b.dataset.modo));
  const dlg = document.getElementById("dlg");
  document.getElementById("dlgFechar").onclick = () => dlg.close();
  document.getElementById("dlgEscolher").onclick = () => { escolherModo(dlg.dataset.modo); dlg.close(); };
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // clicar fora fecha
  textoPadrao();
}

function escolherModo(id) {
  if (!MODOS[id]) return;
  modo = id; gravarPref("aegis_modo", id);
  const r = document.getElementById("m_" + id); if (r) r.checked = true;
  textoPadrao();
}

function abrirModo(id) {
  const m = MODOS[id], dlg = document.getElementById("dlg");
  dlg.dataset.modo = id;
  document.getElementById("dlgTitulo").textContent = m.nome;
  document.getElementById("dlgTec").textContent = m.tec;
  document.getElementById("dlgMede").textContent = m.mede;
  document.getElementById("dlgUso").textContent = m.uso;
  document.getElementById("dlgPainel").textContent = m.painel;
  document.getElementById("dlgEscolher").style.display = id === modo ? "none" : "";
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
}

/** Texto ao lado do botão quando não há medição recente para mostrar. */
function textoPadrao() {
  const msg = document.getElementById("msgMedir");
  if (!msg || msg.dataset.ocupado === "1") return;
  msg.className = "msg";
  msg.textContent = MODOS[modo].vivo ? "O celular liga o relógio e os valores aparecem aqui ao vivo."
    : modo === "ECG" ? "Alguém precisa abrir o ECG no menu do relógio."
    : "O celular grava o sinal do relógio; aqui aparece o resumo no fim.";
}

// ---------- Tela do token ----------
function telaToken(erro) {
  app.innerHTML = `
    <div class="token cartao">
      <div class="rot">Aegis · Painel (protótipo)</div>
      <h2 style="margin:6px 0 4px">Código de acesso</h2>
      <div class="msg">Cole o <b>token_painel</b> que apareceu no fim do script do Supabase.</div>
      <input id="tk" autocomplete="off" spellcheck="false" placeholder="ex.: c4d671d34f09…">
      ${erro ? `<div class="msg erro" style="margin-bottom:10px">${esc(erro)}</div>` : ""}
      <button class="botao" id="ok">Entrar</button>
    </div>`;
  document.getElementById("ok").onclick = () => {
    const v = document.getElementById("tk").value.trim();
    if (!/^[0-9a-f]{32,}$/i.test(v)) return telaToken("O código tem só letras a–f e números (64 caracteres).");
    try { localStorage.setItem("aegis_token_painel", v); } catch (e) {}
    token = v; iniciar();
  };
}

  document.getElementById("medir").onclick = pedirMedicao;

  if (["30", "60", "90"].includes(dur)) document.getElementById("duracao").value = dur;
  document.getElementById("duracao").onchange = e => gravarPref("aegis_duracao", e.target.value);

    janelaMin = +b.dataset.min;
    document.querySelectorAll("#janela button").forEach(x => x.setAttribute("aria-pressed", x === b));
    atualizar();
  });
}

function cartao(rot, val, un, selo) {
  return `<div class="cartao"><div class="rot">${rot}${selo ? ` <span class="selo">${selo}</span>` : ""}</div>
          <div class="val">${val ?? "—"}${val != null && un ? `<small>${un}</small>` : ""}</div></div>`;
}

function desenhar() {
  const d = dados;
  document.getElementById("nome").textContent = d.paciente || "Paciente";

  // Status do celular
  const s = d.status, ponto = document.getElementById("ponto"), est = document.getElementById("estado");
  if (!s) { ponto.className = "ponto"; est.textContent = "O celular ainda não se conectou à nuvem."; }
  else if (s.segundos_atras > 45) { ponto.className = "ponto erro"; est.textContent = `Celular fora do ar (último contato ${ha(s.segundos_atras)})`; }
  else if (s.conexao !== "CONECTADO") { ponto.className = "ponto alerta"; est.textContent = `Celular online · relógio ${s.conexao === "RECONECTANDO" ? "reconectando" : "desconectado"}`; }
  else { ponto.className = "ponto ok"; est.textContent = `Celular online · relógio conectado${s.sensor ? " · gravando " + s.sensor : ""}`; }

  // Cartões com a última leitura
  const u = d.ultima_leitura;
  // SpO2: o relógio quase sempre manda 0 (vira null no banco). Mostra a última que veio de verdade na janela.
  const comSpo2 = u && u.spo2 ? u : [...d.leituras].reverse().find(l => l.spo2);
  document.getElementById("cartoes").innerHTML = u ? [
    cartao("Freq. cardíaca", u.fc, "bpm"),
    comSpo2 ? cartao("SpO₂", comSpo2.spo2, "%", comSpo2 === u ? "" : ha(segDesde(comSpo2.medido_em))) : "",
    cartao("Temperatura", u.temp != null ? num1.format(u.temp) : null, "°C"),
    cartao("Respiração", u.resp, "/min", "estimada"),
  ].join("") : `<div class="cartao vazio" style="grid-column:1/-1">Nenhuma leitura ainda. Toque em “Medir agora”.</div>`;
  document.getElementById("quando").textContent = u ? `Última leitura ${ha(segDesde(u.medido_em))} (${fmtDataHora.format(new Date(u.medido_em))})` : "";

  desenharComando(d.comandos[0]);
  desenharGrafico(d.leituras);

  document.getElementById("sessoes").innerHTML = d.sessoes.length ? d.sessoes.map(x => `
    <li><span>${esc(x.sensor)}${x.duracao_s != null ? ` · ${Math.round(x.duracao_s)} s` : ""}<br><span class="sub">${esc(x.motivo_fim || "")}</span></span>
        <span class="sub" style="text-align:right">${fmtDataHora.format(new Date(x.recebido_em))}${x.quedas_conexao ? `<br>${x.quedas_conexao} ${x.quedas_conexao == 1 ? "queda" : "quedas"} de conexão` : ""}</span></li>`).join("")
    : `<li class="sub">Nenhuma coleta enviada ainda.</li>`;
}

function desenharComando(c) {
  const bt = document.getElementById("medir"), msg = document.getElementById("msgMedir"), barra = document.getElementById("barra");
  const ocupado = c && ["pendente", "executando"].includes(c.estado);
  msg.className = "msg"; msg.dataset.ocupado = "0"; barra.style.display = "none"; bt.disabled = pedindo || ocupado;
  document.querySelectorAll("#modos input").forEach(r => r.disabled = ocupado);
  if (!c) return textoPadrao();
  const m = MODOS[c.sensor || "VITAIS"] || { nome: c.sensor, instr: "" };
  const recente = segDesde(c.concluido_em || c.criado_em) < 600;
  msg.dataset.ocupado = "1";
  if (c.estado === "pendente") {
    msg.textContent = `${m.nome}: pedido enviado ${ha(segDesde(c.criado_em))}. Aguardando o celular…`;
  } else if (c.estado === "executando") {
    const passou = segDesde(c.iniciado_em), total = c.duracao_s + 3;
    msg.textContent = `Medindo ${m.nome}… ${Math.max(0, total - passou)} s restantes. ${m.instr}`;
    barra.style.display = "block"; barra.firstElementChild.style.width = Math.min(100, 100 * passou / total) + "%";
  } else if (c.estado === "concluido" && recente) {
    msg.className = "msg ok";
    msg.innerHTML = resumoResultado(c, m);
  } else if ((c.estado === "erro" || c.estado === "expirado") && recente) {
    msg.className = "msg erro"; msg.textContent = `${m.nome}: não foi possível medir — ${c.erro || c.estado}.`;
  } else {
    msg.dataset.ocupado = "0"; textoPadrao();
  }
}

/** Frase do fim da medição: medianas dos vitais e/ou o resumo da coleta bruta. */
function resumoResultado(c, m) {
  const r = c.resultado || {}, hora = fmtHora.format(new Date(c.concluido_em)), partes = [];
  if (r.fc_mediana != null) partes.push(`FC ${r.fc_mediana} bpm` + (r.fc_min != null ? ` (${r.fc_min}–${r.fc_max})` : ""));
  if (r.spo2_mediana) partes.push(`SpO₂ ${r.spo2_mediana}%`);
  const bruto = (c.sensor || "VITAIS") !== "VITAIS";
  if (bruto) {
    if (r.duracao_s != null) partes.push(`${r.duracao_s} s gravados`);
    const taxa = r.imu_taxa_relogio_hz ?? r.ecg_amostras_s ?? r.amostras_s;
    if (taxa != null) partes.push(`${num1.format(taxa)} amostras/s`);
    if (r.imu_perda_pct != null) partes.push(`perda ${num1.format(r.imu_perda_pct)}%`);
    else if (r.falhas_sequencia) partes.push(`${r.falhas_sequencia} ${r.falhas_sequencia == 1 ? "falha" : "falhas"} de sequência`);
  } else if (r.n != null) partes.push(`${r.n} leituras`);
  if (r.quedas_conexao) partes.push(`${r.quedas_conexao} ${r.quedas_conexao == 1 ? "queda" : "quedas"} de conexão`);
  let t = `${esc(m.nome)} de ${hora}: ${esc(partes.join(", ") || "concluída")}.`;
  if (r.aviso) t += ` <span style="color:var(--alerta)">Atenção: ${esc(r.aviso)}.</span>`;
  if (bruto && r.arquivo) t += `<br><span class="sub" style="color:var(--texto-2)">Arquivo no celular: ${esc(r.arquivo)}</span>`;
  return t;
}

function desenharGrafico(ls) {
  const alvo = document.getElementById("svg"), resumo = document.getElementById("resumoFc");
  const pts = ls.filter(l => l.fc).map(l => ({ t: new Date(l.medido_em).getTime(), v: l.fc }));
  if (pts.length < 2) { alvo.innerHTML = `<div class="vazio">Sem dados de FC nesta janela.</div>`; resumo.textContent = ""; return; }
  const vs = pts.map(p => p.v).sort((a, b) => a - b);
  resumo.textContent = `mín. ${vs[0]} · mediana ${vs[vs.length >> 1]} · máx. ${vs[vs.length - 1]} bpm`;
  const W = Math.max(300, alvo.clientWidth || 700), H = W < 500 ? 200 : 220, m = { l: 34, r: 10, t: 10, b: 24 };
  const t1 = Date.now(), t0 = t1 - janelaMin * 60000;
  const lo = Math.min(50, Math.floor((vs[0] - 5) / 10) * 10), hi = Math.max(110, Math.ceil((vs[vs.length - 1] + 5) / 10) * 10);
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r), y = v => m.t + (hi - v) / (hi - lo) * (H - m.t - m.b);
  let g = "";
  for (let v = lo; v <= hi; v += (hi - lo > 80 ? 20 : 10)) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  for (let i = 0; i <= 4; i++) { const t = t0 + i * (t1 - t0) / 4; g += `<text x="${x(t)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === 4 ? "end" : "middle"}">${fmtHora.format(new Date(t))}</text>`; }
  // quebra a linha onde há buraco > 2 min (medições separadas)
  let d = "", ant = null;
  for (const p of pts) { d += (ant && p.t - ant.t < 120000 ? "L" : "M") + x(p.t).toFixed(1) + " " + y(p.v).toFixed(1); ant = p; }
  const isolados = pts.filter((p, i) => (i === 0 || p.t - pts[i - 1].t >= 120000) && (i === pts.length - 1 || pts[i + 1].t - p.t >= 120000))
    .map(p => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="2.5" fill="var(--linha)"/>`).join("");
  alvo.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Frequência cardíaca na última janela">${g}
    <path d="${d}" fill="none" stroke="var(--linha)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${isolados}</svg>`;
}

async function pedirMedicao() {
  pedindo = true; document.getElementById("medir").disabled = true;
  try {
    await rpc("painel_pedir_medicao", { p_token: token, p_duracao_s: +document.getElementById("duracao").value, p_sensor: modo });
  } catch (e) {
    const msg = document.getElementById("msgMedir"); msg.className = "msg erro"; msg.textContent = "Falha ao pedir: " + e.message;
  }
  pedindo = false; atualizar();
}

async function atualizar() {
  clearTimeout(timer);
  try {
    dados = await rpc("painel_dados", { p_token: token, p_minutos: janelaMin });
    falhas = 0; desenhar();
  } catch (e) {
    if (/token/i.test(e.message)) { try { localStorage.removeItem("aegis_token_painel"); } catch (x) {} return telaToken("Código inválido. Confira o token_painel."); }
    falhas++;
    document.getElementById("estado").textContent = "Sem conexão com a nuvem (" + e.message + "). Tentando de novo…";
    document.getElementById("ponto").className = "ponto erro";
  }
  const ativo = dados && dados.comandos[0] && ["pendente", "executando"].includes(dados.comandos[0].estado);
  timer = setTimeout(atualizar, ativo ? 2000 : Math.min(30000, 10000 * (1 + falhas)));
}

function iniciar() { esqueleto(); atualizar(); }

if (SUPABASE_URL.includes("COLE_AQUI") || CHAVE_PUBLICA.includes("COLE_AQUI")) {
  app.innerHTML = `<div class="token cartao"><h2 style="margin-top:0">Falta configurar</h2>
    <div class="msg">Abra este arquivo num editor de texto e preencha <b>SUPABASE_URL</b> e <b>CHAVE_PUBLICA</b> (os mesmos do ConfigNuvem.java do app).</div></div>`;
} else {
  token = lerToken();
  token ? iniciar() : telaToken();
}
</script>
