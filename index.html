  06/11: controle da cinta pelo painel, gravação relógio + cinta, Marcar/Parar, até 15 min; sinal ao vivo). Ver LEIA-ME.md.
  1. Preencha SUPABASE_URL e CHAVE_PUBLICA abaixo (os mesmos do ConfigNuvem.java do app).

<style>

    }

    --fundo: #0B1220; --superficie: #131C2E; --superficie-alta: #1A2540; --borda: #26324D;

    --primaria: #5B8CFF; --primaria-2: #7AA2FF; --painel: #10234D;
    --ok: #3DD68C; --alerta: #F2BE4B; --perigo: #FF6B6B; --linha: #7AA2FF; --grade: #1F2A42; --h10: #FFAA4D;

  .controles { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; }

                                background: var(--superficie); color: var(--texto); width: 150px; text-transform: uppercase; }
  .controles label.cx { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; cursor: pointer; }
  .controles .botao, .controles .secundario { padding: 9px 14px; }

  .verItem svg { margin-top: 10px; border-radius: 10px; background: var(--superficie-alta); }

  .modo .curto { display: block; font-size: 12.5px; color: var(--texto-2); margin-top: 1px; }

          background: var(--superficie-alta); color: var(--texto-2); font-weight: 700; font-size: 13px; line-height: 26px; }
  .info:hover { background: var(--primaria); color: #fff; }

           background: var(--superficie); color: var(--texto); box-shadow: 0 18px 50px rgba(0,0,0,.35); }

  dialog p { margin: 0; font-size: 14.5px; }

<body>
<main id="app"></main>

<script>
// ======== Preencha (os mesmos valores do ConfigNuvem.java) ========
const SUPABASE_URL  = "https://ajifsgllahlvuscnarus.supabase.co";
const CHAVE_PUBLICA = "sb_publishable_GCwfL1vBgBE-8a8FNkcc-g_ZOtWtWaf";
// ===================================================================

const app = document.getElementById("app");
const fmtHora = new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit" });
const fmtDataHora = new Intl.DateTimeFormat("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
const num1 = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 1, minimumFractionDigits: 1 });
let token = null, dados = null, timer = null, falhas = 0, pedindo = false;

function lerToken() {
  const m = location.hash.match(/[#&]t=([0-9a-f]{32,})/i);
  if (m) { try { localStorage.setItem("aegis_token_painel", m[1]); } catch (e) {} return m[1]; }
  try { return localStorage.getItem("aegis_token_painel"); } catch (e) { return null; }
}

async function rpc(fn, args) {
  const h = { "Content-Type": "application/json", "apikey": CHAVE_PUBLICA };
  if (CHAVE_PUBLICA.startsWith("eyJ")) h["Authorization"] = "Bearer " + CHAVE_PUBLICA;
  const r = await fetch(SUPABASE_URL.replace(/\/+$/, "") + "/rest/v1/rpc/" + fn, { method: "POST", headers: h, body: JSON.stringify(args) });
  const txt = await r.text();
  if (!r.ok) { let m = txt; try { m = JSON.parse(txt).message || txt; } catch (e) {} throw new Error(m); }
  return txt ? JSON.parse(txt) : null;
}

function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function ha(seg) {
  if (seg == null) return "";
  if (seg < 60) return "há " + seg + " s";
  if (seg < 3600) return "há " + Math.round(seg / 60) + " min";
  if (seg < 86400) return "há " + Math.round(seg / 3600) + " h";
  return "há " + Math.round(seg / 86400) + " dias";
}
function segDesde(iso) { return iso ? Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 1000)) : null; }

// ---------- Modos de medição (o mesmo nome que o app entende em Nuvem.sensorPedido) ----------
const RESUMO_BRUTO = "Só um resumo no fim: duração, amostras por segundo, perdas e o nome do arquivo. O sinal fica gravado no celular e vai para o Drive pelo Autosync.";
const MODOS = {

    uso: "Braço parado e apoiado. A FC muda em degraus porque o relógio recalcula a cada 3–6 s. Para ter SpO₂, peça para a pessoa medir antes no menu Blood Oxygen do relógio e esperar o resultado; esse valor aparece no cartão (fica igual durante toda a medição). Sem isso, a SpO₂ vem vazia.",

  },
  PPG: {
    nome: "PPG", curto: "Só o pulso óptico, 25 Hz", tec: "Modo 1 · 25 amostras por segundo",
    mede: "Só o sinal do sensor óptico, sem acelerômetro. Foi o primeiro modo usado no projeto.",
    uso: "Para análise, prefira o PPG + acelerômetro: é o mesmo pulso e ainda mostra se o braço mexeu.",
    painel: RESUMO_BRUTO, instr: "Peça para manter o braço parado."
  },
  IMU: {
    nome: "IMU", curto: "Acelerômetro + giroscópio, 25 Hz", tec: "Modo 5 · 25 amostras por segundo",
    mede: "O movimento do pulso em 6 eixos (aceleração e rotação), com o horário do próprio relógio em cada amostra.",
    uso: "Serve para postura e repouso. Para marcha e quedas é lento demais: use a IMU rápida.",
    painel: RESUMO_BRUTO, instr: ""
  },
  IMU_RAPIDA: {
    nome: "IMU rápida", curto: "Movimento ~190 Hz · marcha e quedas", tec: "Modo 8 · ~190 amostras por segundo",
    mede: "Os mesmos 6 eixos da IMU, cerca de 8 vezes mais rápido. É o modo pensado para marcha, testes de mobilidade e quedas.",
    uso: "A pessoa pode se mexer normalmente. É normal perder cerca de 3% das amostras, em trechos curtos.",
    painel: RESUMO_BRUTO, instr: "A pessoa pode se mexer normalmente."
  },
  IMU_RAPIDA_V: {
    nome: "IMU rápida + FC", curto: "Movimento ~190 Hz com FC", vivo: true, tec: "Modo 8 + comando 0x64",
    mede: "A IMU rápida e, junto, os sinais vitais do relógio a cada segundo.",
    uso: "A pessoa pode se mexer normalmente. Neste modo o relógio não manda SpO₂, só FC.",
    painel: "A FC aparece no gráfico durante a medição; no fim, o resumo da IMU (amostras por segundo, perdas, arquivo) e a FC mediana.",
    instr: "A pessoa pode se mexer normalmente."
  },
  ECG: {
    nome: "ECG", curto: "Precisa abrir o ECG no relógio", atencao: true, tec: "Modo 6 · ~477–482 amostras por segundo (de 500)",
    mede: "Eletrocardiograma de uma derivação, medido entre o pulso e o dedo da outra mão encostado no relógio. Nos testes com a cinta Polar H10 (04–05/11), a FC saiu certa, mas o relógio perde cerca de 4% do sinal no caminho: serve para FC, não para variabilidade.",
    uso: "O relógio só começa o ECG quando alguém abre o ECG no menu do próprio relógio e encosta o dedo no sensor. O celular fica pronto para gravar; se ninguém abrir o menu, a medição termina sem dados.",
    painel: RESUMO_BRUTO, instr: "Peça para abrir o ECG no menu do relógio e encostar o dedo."
  },
  H10: {
    nome: "Só a cinta H10", curto: "RR + ECG + ACC da cinta, sem o relógio", tec: "Polar H10 · RR batimento a batimento, ECG 130 Hz, ACC 200 Hz",
    mede: "A referência da validação sozinha: os intervalos entre batimentos (RR), o ECG do peito e o acelerômetro da cinta, gravados no celular no mesmo formato do Polar Sensor Logger.",
    uso: "A cinta precisa estar conectada ao celular (na seção Cinta Polar H10 acima), no peito e com os eletrodos molhados. ECG e ACC seguem as caixas da seção da cinta.",
    painel: "A FC da cinta aparece no cartão e no bloco da cinta durante a gravação; no fim, o resumo: RR gravados, FC mediana, taxa real do ECG, quedas de conexão.",
    instr: ""
  },
};
const ATIVIDADES = { deitado: "Deitado", sentado: "Sentado", em_pe: "Em pé", caminhada: "Caminhada", livre: "Livre (dia a dia)" };
function nomeAtividade(c) { return ATIVIDADES[c] || (c && /^marca\d*$/.test(c) ? "Marca" : c) || ""; }
const fmtHoraSeg = new Intl.DateTimeFormat("pt-BR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
const numInt = new Intl.NumberFormat("pt-BR");
let modo = "VITAIS";

function lerPref(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function gravarPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function montarModos() {
  const salvo = lerPref("aegis_modo");
  if (MODOS[salvo]) modo = salvo;
  document.getElementById("modos").innerHTML = Object.entries(MODOS).map(([id, m]) => `
    <div class="modo">
      <input type="radio" name="modo" id="m_${id}" value="${id}" ${id === modo ? "checked" : ""}>
      <label for="m_${id}"><span class="nome">${m.nome}${m.vivo ? `<span class="vivo">● AO VIVO</span>` : ""}</span>
        <span class="curto${m.atencao ? " atencao" : ""}">${m.curto}</span></label>
      <button class="info" type="button" data-modo="${id}" aria-label="Sobre o modo ${m.nome}" title="Sobre este modo">?</button>
    </div>`).join("");
  document.querySelectorAll('#modos input').forEach(r => r.onchange = () => escolherModo(r.value));
  document.querySelectorAll('#modos .info').forEach(b => b.onclick = () => abrirModo(b.dataset.modo));
  const dlg = document.getElementById("dlg");
  document.getElementById("dlgFechar").onclick = () => dlg.close();
  document.getElementById("dlgEscolher").onclick = () => { escolherModo(dlg.dataset.modo); dlg.close(); };
  dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });   // clicar fora fecha
  textoPadrao();
}

function escolherModo(id) {
  if (!MODOS[id]) return;
  modo = id; gravarPref("aegis_modo", id);
  const r = document.getElementById("m_" + id); if (r) r.checked = true;
  atualizarComCinta();
  textoPadrao();
}

function abrirModo(id) {
  const m = MODOS[id], dlg = document.getElementById("dlg");
  dlg.dataset.modo = id;
  document.getElementById("dlgTitulo").textContent = m.nome;
  document.getElementById("dlgTec").textContent = m.tec;
  document.getElementById("dlgMede").textContent = m.mede;
  document.getElementById("dlgUso").textContent = m.uso;
  document.getElementById("dlgPainel").textContent = m.painel;
  document.getElementById("dlgEscolher").style.display = id === modo ? "none" : "";
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
}

/** Texto ao lado do botão quando não há medição recente para mostrar. */
function textoPadrao() {
  const msg = document.getElementById("msgMedir");
  if (!msg || msg.dataset.ocupado === "1") return;
  msg.className = "msg";
  msg.textContent = MODOS[modo].vivo ? "O celular liga o relógio e os valores aparecem aqui ao vivo."
    : modo === "ECG" ? "Alguém precisa abrir o ECG no menu do relógio."
    : modo === "H10" ? "O celular grava a cinta (conectada acima); aqui aparece o resumo no fim."
    : "O celular grava o sinal do relógio; aqui aparece o resumo no fim.";
}

// ---------- Tela do token ----------
function telaToken(erro) {
  app.innerHTML = `
    <div class="token cartao">
      <div class="rot">Aegis · Painel (protótipo)</div>
      <h2 style="margin:6px 0 4px">Código de acesso</h2>
      <div class="msg">Cole o <b>token_painel</b> que apareceu no fim do script do Supabase.</div>
      <input id="tk" autocomplete="off" spellcheck="false" placeholder="ex.: c4d671d34f09…">
      ${erro ? `<div class="msg erro" style="margin-bottom:10px">${esc(erro)}</div>` : ""}
      <button class="botao" id="ok">Entrar</button>
    </div>`;
  document.getElementById("ok").onclick = () => {
    const v = document.getElementById("tk").value.trim();
    if (!/^[0-9a-f]{32,}$/i.test(v)) return telaToken("O código tem só letras a–f e números (64 caracteres).");
    try { localStorage.setItem("aegis_token_painel", v); } catch (e) {}
    token = v; iniciar();
  };
}

function cartao(rot, val, un, selo, velho) {
  return `<div class="cartao${velho ? " velho" : ""}"><div class="rot">${rot}${selo ? ` <span class="selo">${selo}</span>` : ""}</div>
          <div class="val">${val ?? "—"}${val != null && un ? `<small>${un}</small>` : ""}</div></div>`;
}

/** completo = false: atualização rápida (painel_vivo), sem redesenhar o gráfico e as coletas. */
function desenhar(completo = true) {
  const d = dados;
  document.getElementById("nome").textContent = d.paciente || "Paciente";

  // Status do celular
  const s = d.status, ponto = document.getElementById("ponto"), est = document.getElementById("estado");
  if (!s) { ponto.className = "ponto"; est.textContent = "O celular ainda não se conectou à nuvem."; }
  else if (s.segundos_atras > 45) { ponto.className = "ponto erro"; est.textContent = `Celular fora do ar (último contato ${ha(s.segundos_atras)})`; }
  else if (s.conexao !== "CONECTADO") { ponto.className = "ponto alerta"; est.textContent = `Celular online · relógio ${s.conexao === "RECONECTANDO" ? "reconectando" : "desconectado"}`; }
  else { ponto.className = "ponto ok"; est.textContent = `Celular online · relógio conectado${s.sensor ? " · gravando " + s.sensor : ""}`; }

  const h10 = desenharH10(s);
  desenharCinta(s);
  desenharAoVivo(s);

  // Cartões com a última leitura (do relógio; a H10 tem o cartão dela)
  const u = d.ultima_leitura;
  // SpO2: o 0x64 só repassa a última SpO2 medida no menu Blood Oxygen do relógio (02/11); sem ela vem 0 (null no banco).
  const comSpo2 = u && u.spo2 ? u : [...d.leituras].reverse().find(l => l.spo2);
  const cartaoH10 = h10 ? cartao("FC · cinta H10", h10.fc, "bpm", "referência") : "";
  // Leitura do relógio com mais de 10 min: esmaecida e com a idade no selo (06/11), para não parecer ao vivo
  const idadeU = u ? segDesde(u.medido_em) : null, velho = idadeU != null && idadeU > 600;
  const selo = base => [base, velho ? ha(idadeU) : ""].filter(Boolean).join(" · ");
  document.getElementById("cartoes").innerHTML = u ? [
    cartao("Freq. cardíaca", u.fc, "bpm", selo(h10 ? "relógio" : ""), velho),
    cartaoH10,
    comSpo2 ? cartao("SpO₂", comSpo2.spo2, "%", "do relógio" + (comSpo2 === u ? (velho ? " · " + ha(idadeU) : "") : " · " + ha(segDesde(comSpo2.medido_em))), velho) : "",
    cartao("Temperatura", u.temp != null ? num1.format(u.temp) : null, "°C", selo(""), velho),
    cartao("Respiração", u.resp, "/min", selo("estimada"), velho),
  ].join("") : cartaoH10 || `<div class="cartao vazio" style="grid-column:1/-1">Nenhuma leitura ainda. Toque em “Medir agora”.</div>`;
  document.getElementById("quando").textContent = u ? `Última leitura ${ha(segDesde(u.medido_em))} (${fmtDataHora.format(new Date(u.medido_em))})` : "";

  desenharComando(d.comandos[0]);
  if (!completo) return;

  document.getElementById("sessoes").innerHTML = d.sessoes.length ? d.sessoes.map(x => `
    <li><span>${x.sensor === "H10" ? "Polar H10" : esc(x.sensor)}${x.duracao_s != null ? ` · ${duracao(x.duracao_s)}` : ""}<br><span class="sub">${esc([x.n_rr != null ? `${x.n_rr} RR` + (x.ecg ? " + ECG" : "") + (x.acc ? " + ACC" : "") : "", x.fc_mediana != null ? `FC ${x.fc_mediana} bpm` : "", x.sinais_parados ? `sinal parou ${x.sinais_parados}×` : "", x.motivo_fim || ""].filter(Boolean).join(" · "))}</span></span>
        <span class="sub" style="text-align:right">${fmtDataHora.format(new Date(x.recebido_em))}${x.quedas_conexao ? `<br>${x.quedas_conexao} ${x.quedas_conexao == 1 ? "queda" : "quedas"} de conexão` : ""}</span></li>`).join("")
    : `<li class="sub">Nenhuma coleta enviada ainda.</li>`;
}

function duracao(seg) {
  seg = Math.round(seg);
  return seg < 120 ? seg + " s" : Math.floor(seg / 60) + " min" + (seg % 60 ? " " + (seg % 60) + " s" : "");
}

/** Linha da cinta Polar H10 no cabeçalho (05/11). Devolve o estado dela se estiver ao vivo com FC, senão null. */
function desenharH10(s) {
  const linha = document.getElementById("h10linha"), ponto = document.getElementById("h10ponto"), est = document.getElementById("h10estado");
  const h = s && s.h10, idade = s ? s.h10_segundos_atras : null;
  // nunca conectou, ou desconectou há mais de 10 min, ou sem notícia há mais de 1 h: some
  if (!h || idade == null || (h.estado === "DESCONECTADO" && idade > 600) || idade > 3600) { linha.style.display = "none"; return null; }
  linha.style.display = "";
  const vivo = idade <= 45 && s.segundos_atras <= 45;
  if (!vivo) { ponto.className = "ponto"; est.textContent = `Cinta H10: sem notícia (último contato ${ha(idade)})`; return null; }
  if (h.estado === "CONECTADO") {
    const partes = ["Cinta H10 conectada"];
    if (h.fc) partes.push(`FC ${h.fc} bpm`);
    if (h.contato === 0) partes.push("sem contato com a pele");
    if (h.bateria != null) partes.push(`bateria ${h.bateria}%`);
    if (h.gravando) partes.push(`gravando ${h.gravando_s != null ? duracao(h.gravando_s + idade) : ""}${h.etapa ? " (" + nomeAtividade(h.etapa).toLowerCase() + ")" : ""}`.trim());
    ponto.className = h.contato === 0 || !h.fc ? "ponto alerta" : "ponto ok";
    est.textContent = partes.join(" · ");
    return h.fc ? h : null;
  }
  if (h.estado === "DESCONECTADO") { ponto.className = "ponto"; est.textContent = "Cinta H10 desconectada"; return null; }
  ponto.className = "ponto alerta";
  est.textContent = "Cinta H10 " + ({ PROCURANDO: "procurando", CONECTANDO: "conectando", RECONECTANDO: "reconectando" }[h.estado] || String(h.estado).toLowerCase()) + "…";
  return null;
}

// ---------- Cinta Polar H10 pelo painel (06/11) ----------
let cintaConectada = false;
const NOMES_ACAO = { h10_conectar: "Conectar a cinta", h10_desconectar: "Desconectar a cinta", h10_iniciar: "Iniciar a gravação da cinta",
                     h10_parar: "Parar a gravação da cinta", marcar: "Marcar", parar_medicao: "Parar a medição" };
function mostrar(id, sim) { document.getElementById(id).classList.toggle("oculto", !sim); }
function mostrarMsg(id, txt, cls) { const m = document.getElementById(id); m.className = "msg" + (cls ? " " + cls : ""); m.textContent = txt || ""; }
function acaoOcupada() { return (dados && dados.acoes || []).some(a => ["pendente", "executando"].includes(a.estado)); }
function ultimaAcao(nomes) { return (dados && dados.acoes || []).find(a => nomes.includes(a.parametros && a.parametros.acao)); }

/** Frase de uma ação: aguardando / feita às HH:MM:SS / erro. null se for antiga (mais de 2 min). */
function textoAcao(a) {
  if (!a) return null;
  const par = a.parametros || {}, r = a.resultado || {};
  let nome = NOMES_ACAO[par.acao] || par.acao;
  if (par.acao === "marcar" && par.etapa && par.etapa !== "marca") nome = "Atividade " + nomeAtividade(par.etapa);
  if (["pendente", "executando"].includes(a.estado)) return [nome + ": enviado ao celular, aguardando…", ""];
  if (segDesde(a.concluido_em || a.criado_em) > 120) return null;
  if (a.estado === "concluido") {
    const quando = r.ms ? fmtHoraSeg.format(new Date(r.ms)) : fmtHoraSeg.format(new Date(a.concluido_em));
    if (par.acao === "h10_conectar") return [`${nome}: o celular está procurando a cinta${r.id ? " " + r.id : ""}…`, "ok"];
    return [`${nome}: feito às ${quando}${r.onde ? " (" + r.onde + ")" : ""}.`, "ok"];
  }
  return [`${nome}: não foi possível — ${a.erro || a.estado}.`, "erro"];
}

function desenharCinta(s) {
  const h = s && s.h10, idade = s ? s.h10_segundos_atras : null;
  const online = !!s && s.segundos_atras <= 45;
  const fresca = online && !!h && idade != null && idade <= 45;   // sem notícia com o celular online = desconectada
  const est = fresca ? h.estado : "DESCONECTADO";
  const conectada = est === "CONECTADO", grav = fresca && !!h.gravando, remoto = grav && !!h.remoto;
  const antigo = fresca && !h.v, ocupado = acaoOcupada() || pedindo;
  cintaConectada = conectada && !grav;
  const ponto = document.getElementById("cPonto"), estado = document.getElementById("cEstado");
  let txt;
  if (!online) { ponto.className = "ponto"; txt = s ? `Celular fora do ar (${ha(s.segundos_atras)}): não dá para controlar a cinta agora.` : "O celular ainda não se conectou à nuvem."; }
  else if (est === "DESCONECTADO") {
    ponto.className = "ponto";
    txt = !h ? "Desconectada. A cinta ainda não se conectou a este celular." : "Desconectada." + (fresca && h.status && h.status !== "Cinta desconectada." ? " " + h.status : "");
  } else if (conectada) {
    ponto.className = "ponto " + (h.parados || h.contato === 0 ? "alerta" : "ok");
    txt = [`Conectada · H10 ${h.id || ""}`.trim(), h.bateria != null ? `bateria ${h.bateria}%` : "",
           grav ? `gravando há ${duracao((h.gravando_s || 0) + idade)}` : ""].filter(Boolean).join(" · ");
  } else { ponto.className = "ponto alerta"; txt = h.status || "Procurando a cinta…"; }
  estado.textContent = txt;

  // FC, RR, contato e atividade
  mostrar("cMini", conectada);
  if (conectada) {
    const tile = (r, v, un) => `<div><div class="r">${r}</div><div class="v">${v ?? "—"}${v != null && un ? `<small>${un}</small>` : ""}</div></div>`;
    document.getElementById("cMini").innerHTML = [
      tile("FC", h.fc, "bpm"), tile("RR", h.rr, "ms"),
      // a H10 só informa o contato com ECG/ACC ligado (gravando ou vendo o ECG) — 06/11
      h.contato === 1 || h.contato === 0 ? tile("Contato", h.contato === 1 ? "ok" : "sem contato") : tile("Contato (só c/ ECG)", "—"),
      grav ? tile("Atividade", h.etapa ? esc(nomeAtividade(h.etapa)) : "—", "") : "",
      grav ? tile("Marcas", h.marcas ?? 0, "") : "",
    ].join("");
  }
  // Contadores gravados + taxa ao vivo
  mostrar("cContagem", grav);
  if (grav) {
    const taxa = (n, ativo, t) => ativo && n > 0 ? (t != null ? ` (${t}/s)` : "") : " (aguardando)";
    const partes = h.n_rr != null ? [`${numInt.format(h.n_rr)} RR`] : [];
    if (h.ecg) partes.push(`${numInt.format(h.n_ecg || 0)} ECG${taxa(h.n_ecg, h.ecg_ativo, h.taxa_ecg)}`);
    if (h.acc) partes.push(`${numInt.format(h.n_acc || 0)} ACC${taxa(h.n_acc, h.acc_ativo, h.taxa_acc)}`);
    document.getElementById("cContagem").textContent = (partes.length ? "Gravado: " + partes.join(" · ") : "Gravando.")
      + (remoto ? " — junto com a medição do painel (Marcar e Parar ficam na medição, abaixo)." : "");
  }
  const al = document.getElementById("cAlerta");
  mostrar("cAlerta", grav && !!h.parados);
  if (grav && h.parados) al.textContent = `⚠ ${h.parados} ${h.parados.includes(",") ? "pararam" : "parou"} de chegar há mais de 5 s. Confira a cinta (contato dos eletrodos, distância do celular).`;

  // Controles
  mostrar("cConectar", online && !conectada);
  const btCon = document.getElementById("cBtConectar");
  btCon.textContent = est === "DESCONECTADO" ? "Conectar" : "Cancelar";
  btCon.onclick = est === "DESCONECTADO"
    ? () => acao("h10_conectar", { id: document.getElementById("cId").value.trim().toUpperCase() })
    : () => acao("h10_desconectar");
  document.getElementById("cId").disabled = est !== "DESCONECTADO";
  mostrar("cParado", online && conectada && !grav);
  mostrar("cGravando", online && grav && !remoto);
  for (const id of ["cBtConectar", "cBtIniciar", "cBtDesconectar", "cBtMarcar", "cBtParar", "cNovaAtividade"]) document.getElementById(id).disabled = ocupado;
  mostrar("cNota", online && !conectada);

  const msg = textoAcao(ultimaAcao(["h10_conectar", "h10_desconectar", "h10_iniciar", "h10_parar", "marcar"]));
  if (antigo) mostrarMsg("cMsg", "O app do celular é de antes de 06/11: atualize-o para controlar a cinta pelo painel.", "erro");
  else if (msg) mostrarMsg("cMsg", msg[0], msg[1]);
  else if (document.getElementById("cMsg").className !== "msg erro" || !acaoErroLocal) mostrarMsg("cMsg", "");
  atualizarComCinta();
}

/** Caixa "+ cinta H10" da medição: some no modo "Só a cinta"; só vale com a cinta conectada e parada. */
function atualizarComCinta() {
  const rot = document.getElementById("comCintaRot"), cx = document.getElementById("comCinta");
  if (!rot) return;
  rot.style.display = modo === "H10" ? "none" : "inline-flex";
  cx.disabled = !cintaConectada;
  rot.style.opacity = cintaConectada ? "1" : ".5";
  rot.title = cintaConectada ? "Grava a cinta junto, com a mesma atividade e a mesma hora do celular" : "Conecte a cinta acima para gravar junto";
}

let acaoErroLocal = false;
async function acao(nome, parametros) {
  const alvo = ["marcar", "parar_medicao"].includes(nome) && document.getElementById("durante") && !document.getElementById("durante").classList.contains("oculto") ? "mMsg" : "cMsg";
  acaoErroLocal = false;
  mostrarMsg(alvo, (NOMES_ACAO[nome] || nome) + ": enviando…");
  try {
    await rpc("painel_acao", { p_token: token, p_acao: nome, p_parametros: parametros || {} });
  } catch (e) {
    acaoErroLocal = true;
    mostrarMsg(alvo, `${NOMES_ACAO[nome] || nome}: falha ao enviar — ${e.message}${/painel_acao/.test(e.message) ? " (rode a migração de 06/11 no Supabase)" : ""}`, "erro");
    return;
  }
  vivo();
}

// ---------- Sinal ao vivo (06/11, 2ª parte; 15h: vários ao mesmo tempo, um gráfico embaixo do outro) ----------
let verFontes = [], verErro = null;
const NOMES_VER = { h10_ecg: "ECG da cinta", relogio_ppg: "PPG do relógio", relogio_ecg: "ECG do relógio" };

function ligarAoVivo() {
  document.querySelectorAll("#verSeg button").forEach(b => b.onclick = () => ver(b.dataset.f));
  document.addEventListener("visibilitychange", () => { if (!document.hidden && verFontes.length) vivo(); });
}

/** Liga ou desliga um sinal. PPG e ECG do relógio se excluem (o relógio tem um modo por vez). */
async function ver(f) {
  if (verFontes.includes(f)) return pararDeVer(f);
  if (f.startsWith("relogio_")) verFontes = verFontes.filter(x => !x.startsWith("relogio_"));
  verFontes = [...verFontes, f].sort((a, b) => Object.keys(NOMES_VER).indexOf(a) - Object.keys(NOMES_VER).indexOf(b));
  verErro = null;
  rtConectar();
  desenharAoVivo(dados && dados.status);
  try {
    await rpc("painel_acao", { p_token: token, p_acao: "ver", p_parametros: { fonte: f, canal: CANAL_VIVO } });
  } catch (e) {
    verErro = /desconhecida|ver/.test(e.message) && /a[cç][aã]o|sinal/.test(e.message)
      ? "Falta rodar a migração 06/11b (traçado) no Supabase." : "Falha ao pedir: " + e.message;
  }
  vivo();
}

function pararDeVer(f) {
  verFontes = verFontes.filter(x => x !== f);
  delete rt.fontes[f];
  if (!verFontes.length) rtDesligar();
  verErro = null;
  rpc("painel_vivo", { p_token: token, p_ver: verFontes.join(",") }).catch(() => {});
  if (dados && dados.tracados) dados.tracados = dados.tracados.filter(t => t.fonte !== f);
  desenharAoVivo(dados && dados.status);
}

/** Botões (o que dá para ver agora) e um gráfico por sinal ligado, com o último trecho que o celular mandou. */
function desenharAoVivo(s) {
  const online = !!s && s.segundos_atras <= 45, h = s && s.h10;
  const cinta = online && h && s.h10_segundos_atras <= 45 && h.estado === "CONECTADO";
  const relogio = online && s.conexao === "CONECTADO";
  const gravandoOutro = relogio && s.sensor && !["PPG-ACC", "ECG"].includes(s.sensor);
  const pode = { h10_ecg: cinta, relogio_ppg: relogio && !gravandoOutro, relogio_ecg: relogio && !gravandoOutro };
  const motivo = { h10_ecg: "Conecte a cinta", relogio_ppg: gravandoOutro ? "O relógio está gravando outro modo" : "Relógio desconectado",
                   relogio_ecg: gravandoOutro ? "O relógio está gravando outro modo" : "Relógio desconectado" };
  document.querySelectorAll("#verSeg button").forEach(b => {
    const f = b.dataset.f, liga = verFontes.includes(f);
    b.setAttribute("aria-pressed", liga);
    b.disabled = !pode[f] && !liga;
    b.title = pode[f] ? (liga ? "Parar de ver" : "Ver " + NOMES_VER[f] + (f.startsWith("relogio_") ? " (o relógio mostra um sinal por vez)" : "")) : motivo[f];
  });
  mostrar("verArea", verFontes.length > 0);
  const err = document.getElementById("verErro");
  err.textContent = verErro || ""; mostrar("verErro", !!verErro);
  const area = document.getElementById("verGraficos");
  // um bloco por sinal, na ordem dos botões (recria só quando a lista muda, para não piscar)
  if (area.dataset.lista !== verFontes.join(",")) {
    area.dataset.lista = verFontes.join(",");
    area.innerHTML = verFontes.map(f => `<div class="verItem" data-f="${f}"><div class="svg"></div><div class="msg"></div></div>`).join("");
  }
  const lista = (dados && dados.tracados) || (dados && dados.tracado ? [dados.tracado] : []);
  for (const f of verFontes) {
    const item = area.querySelector(`.verItem[data-f="${f}"]`), info = item.querySelector(".msg"), alvo = item.querySelector(".svg");
    if (rtAoVivo(f)) {   // 09/11: chegando pelo Realtime: o canvas rola sozinho (rtQuadro), aqui só o texto
      const st = rt.fontes[f];
      if (!alvo.querySelector("canvas")) alvo.innerHTML = "<canvas></canvas>";
      info.textContent = [NOMES_VER[f], st.info ? st.info : "", `ao vivo, ~${num1.format(ATRASO_S)} s atrás do celular`,
                          f === "relogio_ppg" ? "filtrado 0,5–5 Hz" : ""].filter(Boolean).join(" · ");
      continue;
    }
    if (alvo.querySelector("canvas")) alvo.innerHTML = "";
    const t = lista.find(x => x && x.fonte === f);
    if (!t) { info.textContent = `${NOMES_VER[f]}: aguardando o celular…`; alvo.innerHTML = ""; continue; }
    const idade = Math.round(t.segundos_atras);
    // velho: trecho antigo, ou o celular avisa que o sinal não está chegando (manda o último guardado)
    const velho = idade > 8 || !!t.info, ppg = f === "relogio_ppg";
    // PPG: o celular manda 10 s brutos; aqui filtra 0,5–5 Hz, inverte (pulso para cima) e mostra os últimos 8 s
    const vals = ppg && t.amostras.length > 10 ? filtroPpg(t.amostras, +t.taxa_hz).slice(-Math.round(8 * t.taxa_hz)) : t.amostras;
    info.textContent = [NOMES_VER[f], rt.erro && verFontes.length ? "modo de 2 s (" + rt.erro + ")" : "", t.info ? t.info + " (traçado antigo)" : "", idade > 8 ? `sem trecho novo há ${idade} s` : `atualizado há ${idade} s`,
                        vals.length ? `${num1.format(vals.length / t.taxa_hz)} s` + (ppg ? " (filtrado 0,5–5 Hz)" : "") : ""].filter(Boolean).join(" · ");
    desenharTracado(alvo, vals, ppg ? "var(--linha)" : f === "h10_ecg" ? "var(--h10)" : "var(--ok)", velho);
  }
}

/** Mesmo filtro do app (FiltroPpg.java) e do comparar_ppg.py: Butterworth 0,5–5 Hz ida e volta; invertido. */
function filtroPpg(x, fs) {
  const biquad = (fc, pa) => {
    const w = 2 * Math.PI * fc / fs, cw = Math.cos(w), al = Math.sin(w) / (2 * Math.SQRT1_2), a0 = 1 + al;
    const b0 = (pa ? (1 + cw) : (1 - cw)) / 2 / a0, b1 = (pa ? -(1 + cw) : (1 - cw)) / a0;
    return [b0, b1, b0, -2 * cw / a0, (1 - al) / a0];
  };
  const aplicar = (y, c) => {
    const g = (c[0] + c[1] + c[2]) / (1 + c[3] + c[4]);
    let x1 = y[0], x2 = y[0], y1 = y[0] * g, y2 = y1;
    for (let i = 0; i < y.length; i++) { const x0 = y[i], s = c[0] * x0 + c[1] * x1 + c[2] * x2 - c[3] * y1 - c[4] * y2; x2 = x1; x1 = x0; y2 = y1; y1 = s; y[i] = s; }
  };
  const m = x.reduce((a, b) => a + b, 0) / x.length;
  let y = x.map(v => v - m);
  for (const c of [biquad(0.5, true), biquad(Math.min(5, fs * 0.45), false)]) { aplicar(y, c); y.reverse(); aplicar(y, c); y.reverse(); }
  return y.map(v => -v);
}

function desenharTracado(alvo, a, cor, velho) {
  if (!a || a.length < 2) { alvo.innerHTML = ""; return; }
  const W = Math.max(300, alvo.clientWidth || 700), H = 120, m = 6;
  let lo = Math.min(...a), hi = Math.max(...a);
  const amp = Math.max(hi - lo, 1); lo -= amp * 0.08; hi += amp * 0.08;
  const x = i => m + i * (W - 2 * m) / (a.length - 1), y = v => m + (hi - v) / (hi - lo) * (H - 2 * m);
  let d = "";
  a.forEach((v, i) => { d += (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1); });
  let g = "";
  for (let k = 1; k < 4; k++) g += `<line x1="${W * k / 4}" x2="${W * k / 4}" y1="0" y2="${H}" stroke="var(--grade)"/>`;
  alvo.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sinal ao vivo">${g}<path d="${d}" fill="none" stroke="${cor}" stroke-width="1.6" stroke-linejoin="round" opacity="${velho ? .45 : 1}"/></svg>`;
}

// ---------- Sinal ao vivo pelo Realtime do Supabase (09/11: fluido, ~0,6 s atrás do celular) ----------
// O painel gera um canal aleatório a cada abertura e manda junto com o "ver"; o app novo publica nele 5×/s só as
// amostras novas (Broadcast, sem passar pelo banco) com o contador total. Aqui: emenda pelo contador, filtra o PPG
// em fluxo e desenha num canvas que anda continuamente, ATRASO_S atrás da amostra mais nova (folga para a internet).
// Sem mensagem por 2,5 s (app antigo, Realtime fora): volta sozinho ao traçado de 2 s.
const CANAL_VIVO = "aegis-" + Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join("");
const ATRASO_S = 0.6, JANELA_S = { h10_ecg: 4, relogio_ppg: 8, relogio_ecg: 4 };
const rt = { ws: null, ref: 0, hb: null, tentativa: 0, erro: null, fontes: {}, laco: false, ultimoQuadro: 0 };

function rtConectar() {
  if (rt.ws || !verFontes.length || typeof WebSocket === "undefined") return;
  const url = SUPABASE_URL.replace(/\/+$/, "").replace(/^http/, "ws") + "/realtime/v1/websocket?apikey="
            + encodeURIComponent(CHAVE_PUBLICA) + "&vsn=1.0.0";
  let ws;
  try { ws = new WebSocket(url); } catch (e) { rt.erro = "sem conexão ao vivo"; return rtDepois(); }
  rt.ws = ws;
  const mandar = m => { if (ws.readyState === 1) ws.send(JSON.stringify(m)); };
  ws.onopen = () => {
    rt.tentativa = 0;
    const ref = String(++rt.ref);
    mandar({ topic: "realtime:" + CANAL_VIVO, event: "phx_join", ref, join_ref: ref,
             payload: { config: { broadcast: { ack: false, self: false }, presence: { key: "", enabled: false },
                                  postgres_changes: [], private: false } } });
    clearInterval(rt.hb);
    rt.hb = setInterval(() => mandar({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++rt.ref) }), 25000);
  };
  ws.onmessage = ev => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.topic !== "realtime:" + CANAL_VIVO) return;
    if (m.event === "phx_reply" && m.payload && m.payload.status && m.payload.status !== "ok") {
      rt.erro = "Realtime recusou: " + JSON.stringify(m.payload.response || m.payload).slice(0, 120);
    } else if (m.event === "phx_reply") {
      rt.erro = null;
    } else if (m.event === "broadcast" && m.payload && m.payload.event === "sinal") {
      rtChegou(m.payload.payload);
    }
  };
  ws.onerror = () => {};
  ws.onclose = () => { clearInterval(rt.hb); if (rt.ws === ws) { rt.ws = null; rtDepois(); } };
}

function rtDepois() {
  if (!verFontes.length) return;
  setTimeout(rtConectar, Math.min(15000, 1000 * 2 ** rt.tentativa++));
}

function rtDesligar() {
  const ws = rt.ws;
  rt.ws = null;
  clearInterval(rt.hb);
  if (ws) try { ws.close(); } catch (e) { }
}

/** Coeficientes de um biquad Butterworth (passa-altas ou passa-baixas), como o filtroPpg. */
function rtBiquad(fc, fs, pa) {
  const w = 2 * Math.PI * fc / fs, cw = Math.cos(w), al = Math.sin(w) / (2 * Math.SQRT1_2), a0 = 1 + al;
  const b0 = (pa ? (1 + cw) : (1 - cw)) / 2 / a0, b1 = (pa ? -(1 + cw) : (1 - cw)) / a0;
  return [b0, b1, b0, -2 * cw / a0, (1 - al) / a0];
}

function rtNovo(f, hz) {
  const cap = Math.ceil(hz * 20);
  const st = { f, hz, cap, buf: new Float64Array(cap).fill(NaN), fim: null, cab: null, ultimaMsg: 0, info: null, lo: null, hi: null, filtro: null, pend: [] };
  if (f === "relogio_ppg") st.coef = [rtBiquad(0.5, hz, true), rtBiquad(Math.min(5, hz * 0.45), hz, false)];
  return st;
}

/** PPG em fluxo: passa-altas 0,5 Hz + passa-baixas 5 Hz (só ida, para não mexer no que já foi desenhado), invertido. */
function rtFiltrar(st, x) {
  if (!st.coef) return x;
  const comeca = !st.filtro;
  if (comeca) st.filtro = st.coef.map(() => ({}));
  let v = x;
  st.coef.forEach((c, i) => {
    const e = st.filtro[i];
    if (comeca) {   // parte do regime: sem o degrau do início (cada estágio com a sua entrada)
      const g = (c[0] + c[1] + c[2]) / (1 + c[3] + c[4]);
      e.x1 = e.x2 = v; e.y1 = e.y2 = v * g;
    }
    const y = c[0] * v + c[1] * e.x1 + c[2] * e.x2 - c[3] * e.y1 - c[4] * e.y2;
    e.x2 = e.x1; e.x1 = v; e.y2 = e.y1; e.y1 = y; v = y;
  });
  return -v;
}

function rtChegou(carga) {
  const lista = carga && Array.isArray(carga.s) ? carga.s : [];
  let novo = false;
  const agora = performance.now();
  for (const it of lista) {
    const f = it.f, hz = +it.hz, fim = +it.fim, a = Array.isArray(it.a) ? it.a : [];
    if (!verFontes.includes(f) || !(hz > 0) || !Number.isFinite(fim)) continue;
    let st = rt.fontes[f];
    if (!st || st.hz !== hz || (st.fim != null && fim < st.fim - st.cap)) st = rt.fontes[f] = rtNovo(f, hz);   // app reiniciou
    if (st.ultimaMsg === 0 || agora - st.ultimaMsg > 2500) novo = true;
    st.ultimaMsg = agora;
    st.info = it.info || null;
    if (st.fim == null) st.fim = fim - a.length;
    if (a.length) st.pend.push({ ini: fim - a.length, fim, a, chegou: agora });
    rtProcessar(st, agora);
  }
  if (novo) desenharAoVivo(dados && dados.status);   // troca o traçado de 2 s pelo canvas
  if (!rt.laco && Object.keys(rt.fontes).length) { rt.laco = true; rt.ultimoQuadro = performance.now(); requestAnimationFrame(rtQuadro); }
}

/**
 * Emenda os pedaços na ordem do contador. Pedaço que chega antes do anterior (internet fora de ordem) espera até
 * 0,4 s pelo que falta; depois disso o buraco fica vazio no traçado.
 */
function rtProcessar(st, agora) {
  st.pend.sort((p, q) => p.ini - q.ini);
  while (st.pend.length) {
    const p = st.pend[0];
    if (p.fim <= st.fim) { st.pend.shift(); continue; }                 // repetido
    if (p.ini > st.fim) {                                                // falta um pedaço antes deste
      if (agora - p.chegou < 400) break;
      for (let j = Math.max(st.fim + 1, p.ini + 1 - st.cap); j <= p.ini; j++) st.buf[j % st.cap] = NaN;
      st.filtro = null;
      st.fim = p.ini;
    }
    for (let k = st.fim + 1; k <= p.fim; k++) st.buf[k % st.cap] = rtFiltrar(st, +p.a[k - p.ini - 1]);
    st.fim = p.fim;
    st.pend.shift();
    if (st.cab == null) st.cab = st.fim - st.hz * ATRASO_S;
  }
}

function rtAoVivo(f) {
  const st = rt.fontes[f];
  return !!st && st.cab != null && performance.now() - st.ultimaMsg < 2500;
}

function rtQuadro(agora) {
  const dt = Math.min(0.1, Math.max(0, (agora - rt.ultimoQuadro) / 1000));
  rt.ultimoQuadro = agora;
  let algum = false;
  const css = getComputedStyle(document.documentElement);
  for (const f of verFontes) {
    const st = rt.fontes[f];
    if (st && st.pend.length) rtProcessar(st, agora);
    if (!st || st.cab == null) continue;
    algum = true;
    // a cabeça anda no ritmo do sinal e corrige devagar (±20%) para ficar ATRASO_S atrás da amostra mais nova
    const atras = (st.fim - st.hz * ATRASO_S - st.cab) / st.hz;
    if (Math.abs(atras) > 2) st.cab = st.fim - st.hz * ATRASO_S;   // aba voltou do segundo plano, internet travou
    else st.cab += st.hz * dt * (1 + Math.max(-0.2, Math.min(0.2, atras * 0.4)));
    if (st.cab > st.fim) st.cab = st.fim;
    const cv = document.querySelector(`.verItem[data-f="${f}"] canvas`);
    if (cv) rtDesenhar(cv, st, css.getPropertyValue(f === "relogio_ppg" ? "--linha" : f === "h10_ecg" ? "--h10" : "--ok").trim(),
                       css.getPropertyValue("--grade").trim(), !rtAoVivo(f));
  }
  if (algum && verFontes.length) requestAnimationFrame(rtQuadro); else rt.laco = false;
}

function rtDesenhar(cv, st, cor, grade, parado) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth || 600, H = cv.clientHeight || 120;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const n = Math.round((JANELA_S[st.f] || 4) * st.hz), fimJ = st.cab, iniJ = fimJ - n, m = 6;
  const x = k => (k - iniJ) / n * W;
  // grade de 1 s que anda junto com o sinal
  ctx.strokeStyle = grade; ctx.lineWidth = 1; ctx.beginPath();
  for (let s = Math.ceil(iniJ / st.hz); s * st.hz <= fimJ; s++) { const xx = Math.round(x(s * st.hz)) + 0.5; ctx.moveTo(xx, 0); ctx.lineTo(xx, H); }
  ctx.stroke();
  const k0 = Math.max(Math.floor(iniJ), st.fim - st.cap + 1), k1 = Math.min(Math.ceil(fimJ), st.fim);
  let lo = Infinity, hi = -Infinity;
  for (let k = k0; k <= k1; k++) { const v = st.buf[((k % st.cap) + st.cap) % st.cap]; if (v === v) { if (v < lo) lo = v; if (v > hi) hi = v; } }
  if (lo > hi) return;
  const amp = Math.max(hi - lo, 1e-6);
  lo -= amp * 0.08; hi += amp * 0.08;
  // escala suave (não pula a cada batimento)
  if (st.lo == null) { st.lo = lo; st.hi = hi; }
  st.lo += (lo - st.lo) * (lo < st.lo ? 0.3 : 0.03);
  st.hi += (hi - st.hi) * (hi > st.hi ? 0.3 : 0.03);
  const y = v => m + (st.hi - v) / (st.hi - st.lo || 1) * (H - 2 * m);
  ctx.strokeStyle = cor; ctx.globalAlpha = parado ? 0.45 : 1; ctx.lineWidth = 1.6; ctx.lineJoin = "round"; ctx.beginPath();
  let caneta = false;
  for (let k = k0; k <= k1; k++) {
    const v = st.buf[((k % st.cap) + st.cap) % st.cap];
    if (v !== v) { caneta = false; continue; }
    if (caneta) ctx.lineTo(x(k), y(v)); else { ctx.moveTo(x(k), y(v)); caneta = true; }
  }
  ctx.stroke();
  ctx.globalAlpha = 1;
}

function desenharComando(c) {
  const bt = document.getElementById("medir"), msg = document.getElementById("msgMedir"), barra = document.getElementById("barra");
  const ocupado = c && ["pendente", "executando"].includes(c.estado);
  msg.className = "msg"; msg.dataset.ocupado = "0"; barra.style.display = "none"; bt.disabled = pedindo || ocupado;
  document.querySelectorAll("#modos input").forEach(r => r.disabled = ocupado);
  for (const id of ["duracao", "atividadeMed"]) document.getElementById(id).disabled = ocupado;
  const executando = !!c && c.estado === "executando";
  mostrar("durante", executando);
  if (executando) {
    for (const id of ["mBtMarcar", "mBtParar", "mNovaAtividade"]) document.getElementById(id).disabled = acaoOcupada();
    const t = textoAcao(ultimaAcao(["marcar", "parar_medicao"]));
    const a = ultimaAcao(["marcar", "parar_medicao"]);
    if (t && a && new Date(a.criado_em) >= new Date(c.iniciado_em)) mostrarMsg("mMsg", t[0], t[1]);
    else if (!acaoErroLocal) mostrarMsg("mMsg", "");
  }
  if (!c) return textoPadrao();
  const comCinta = c.sensor !== "H10" && c.parametros && c.parametros.h10;
  const m0 = MODOS[c.sensor || "VITAIS"] || { nome: c.sensor, instr: "" };
  const m = comCinta ? { ...m0, nome: m0.nome + " + cinta H10" } : m0;
  const recente = segDesde(c.concluido_em || c.criado_em) < 600;
  msg.dataset.ocupado = "1";
  if (c.estado === "pendente") {
    msg.textContent = `${m.nome}: pedido enviado ${ha(segDesde(c.criado_em))}. Aguardando o celular…`;
  } else if (c.estado === "executando") {
    const passou = segDesde(c.iniciado_em), total = c.duracao_s + 3;
    const at = c.parametros && c.parametros.atividade ? ` Atividade: ${nomeAtividade(c.parametros.atividade)}.` : "";
    msg.textContent = `Medindo ${m.nome}… ${duracao(Math.max(0, total - passou))} restantes.${at} ${m.instr}`;
    barra.style.display = "block"; barra.firstElementChild.style.width = Math.min(100, 100 * passou / total) + "%";
  } else if (c.estado === "concluido" && recente) {
    msg.className = "msg ok";
    msg.innerHTML = resumoResultado(c, m);
  } else if ((c.estado === "erro" || c.estado === "expirado") && recente) {
    msg.className = "msg erro"; msg.textContent = `${m.nome}: não foi possível medir — ${c.erro || c.estado}.`;
  } else {
    msg.dataset.ocupado = "0"; textoPadrao();
  }
}

/** Frase do fim da medição: medianas dos vitais e/ou o resumo da coleta bruta. */
function resumoResultado(c, m) {
  const r = c.resultado || {}, hora = fmtHora.format(new Date(c.concluido_em)), partes = [];
  if (c.sensor !== "H10" && r.fc_mediana != null) partes.push(`FC ${r.fc_mediana} bpm` + (r.fc_min != null ? ` (${r.fc_min}–${r.fc_max})` : ""));
  if (r.spo2_mediana) partes.push(`SpO₂ ${r.spo2_mediana}% (última medida no relógio)`);
  const bruto = (c.sensor || "VITAIS") !== "VITAIS";
  const resumoCinta = h => {
    const p = [];
    if (h.duracao_s != null && c.sensor === "H10") p.push(`${duracao(h.duracao_s)} gravados`);
    if (h.n_rr != null) p.push(`${numInt.format(h.n_rr)} RR`);
    if (h.fc_mediana != null) p.push(`FC ${h.fc_mediana} bpm (${h.fc_min}–${h.fc_max})`);
    if (h.ecg_hz_estimada != null) p.push(`ECG ${num1.format(h.ecg_hz_estimada)} Hz`);
    if (h.acc_s != null) p.push(`ACC ${num1.format(h.acc_s)}/s`);
    if (h.quedas_conexao && c.sensor !== "H10") p.push(`${h.quedas_conexao} ${h.quedas_conexao == 1 ? "queda" : "quedas"} de conexão`);
    return p.join(", ");
  };
  if (c.sensor === "H10") {
    partes.push(resumoCinta(r));
  } else if (bruto) {
    if (r.duracao_s != null) partes.push(`${r.duracao_s} s gravados`);
    const taxa = r.imu_taxa_relogio_hz ?? r.ecg_amostras_s ?? r.amostras_s;
    if (taxa != null) partes.push(`${num1.format(taxa)} amostras/s`);
    if (r.imu_perda_pct != null) partes.push(`perda ${num1.format(r.imu_perda_pct)}%`);
    else if (r.falhas_sequencia) partes.push(`${r.falhas_sequencia} ${r.falhas_sequencia == 1 ? "falha" : "falhas"} de sequência`);
  } else if (r.n != null) partes.push(`${r.n} leituras`);
  if (r.quedas_conexao) partes.push(`${r.quedas_conexao} ${r.quedas_conexao == 1 ? "queda" : "quedas"} de conexão`);
  let t = `${esc(m.nome)} de ${hora}: ${esc(partes.filter(Boolean).join(", ") || "concluída")}.`;
  if (c.sensor !== "H10" && c.parametros && c.parametros.h10) {
    t += r.h10 ? `<br>Cinta H10: ${esc(resumoCinta(r.h10) || "sem dados")}.`
      : `<br><span style="color:var(--alerta)">A cinta não gravou junto (app do celular de antes de 06/11?).</span>`;
  }
  if (r.aviso) t += ` <span style="color:var(--alerta)">Atenção: ${esc(r.aviso)}.</span>`;
  if (bruto && r.arquivo) t += `<br><span class="sub" style="color:var(--texto-2)">Arquivo no celular: ${esc(r.arquivo)}</span>`;
  if (r.h10 && r.h10.arquivo && c.sensor !== "H10") t += `<br><span class="sub" style="color:var(--texto-2)">Cinta: ${esc(r.h10.arquivo)}</span>`;
  return t;
}

async function pedirMedicao() {
  pedindo = true; document.getElementById("medir").disabled = true;
  try {
    const par = {}, at = document.getElementById("atividadeMed").value;
    if (at) par.atividade = at;
    const cinta = { ecg: document.getElementById("cEcg").checked, acc: document.getElementById("cAcc").checked };
    if (modo === "H10" || (document.getElementById("comCinta").checked && cintaConectada)) par.h10 = cinta;
    const args = { p_token: token, p_duracao_s: +document.getElementById("duracao").value, p_sensor: modo };
    if (Object.keys(par).length) args.p_parametros = par;
    await rpc("painel_pedir_medicao", args);
  } catch (e) {
    const msg = document.getElementById("msgMedir"); msg.className = "msg erro"; msg.textContent = "Falha ao pedir: " + e.message;
  }
  pedindo = false; vivo();
}

// Atualização (06/11): completa (painel_dados, com as leituras) a cada 10–15 s; com algo ao vivo (cinta conectada,
// medição ou ação em andamento), o estado leve (painel_vivo) a cada 3 s entre as completas.
let ultimaCompleta = 0, semVivo = false;
function algoAoVivo() {
  if (!dados) return false;
  const s = dados.status, h = s && s.h10;
  const cinta = h && s.h10_segundos_atras <= 45 && s.segundos_atras <= 45 && h.estado !== "DESCONECTADO";
  const cmd = dados.comandos[0] && ["pendente", "executando"].includes(dados.comandos[0].estado);
  return cinta || cmd || acaoOcupada();
}
function agendar() {
  clearTimeout(timer);
  if (falhas) { timer = setTimeout(atualizar, Math.min(30000, 10000 * (1 + falhas))); return; }
  if (verFontes.length && !semVivo) { timer = setTimeout(() => (Date.now() - ultimaCompleta > 15000 ? atualizar() : vivo()), 2000); return; }
  if (algoAoVivo()) timer = setTimeout(() => (semVivo || Date.now() - ultimaCompleta > 15000 ? atualizar() : vivo()), semVivo ? 2000 : 3000);
  else timer = setTimeout(atualizar, 10000);
}
function falhou(e) {
  if (/token/i.test(e.message)) { try { localStorage.removeItem("aegis_token_painel"); } catch (x) {} telaToken("Código inválido. Confira o token_painel."); return true; }
  falhas++;
  document.getElementById("estado").textContent = "Sem conexão com a nuvem (" + e.message + "). Tentando de novo…";
  document.getElementById("ponto").className = "ponto erro";
  return false;
}
async function atualizar() {
  clearTimeout(timer);
  try {
    const tracados = dados && dados.tracados, tracado = dados && dados.tracado;   // a completa não traz os traçados: guarda os últimos
    // 06/11: sem o gráfico de FC, basta o mínimo (5 min) de leituras (usado só para a última SpO₂)
    dados = await rpc("painel_dados", { p_token: token, p_minutos: 5 });
    if (!dados.acoes) dados.acoes = [];
    if (verFontes.length) { dados.tracados = tracados; dados.tracado = tracado; }
    falhas = 0; ultimaCompleta = Date.now(); desenhar();
  } catch (e) { if (falhou(e)) return; }
  agendar();
}
async function vivo() {
  if (!dados || semVivo) return atualizar();
  clearTimeout(timer);
  try {
    const args = { p_token: token };
    if (verFontes.length && !document.hidden) args.p_ver = verFontes.join(",");
    let v;
    try { v = await rpc("painel_vivo", args); }
    catch (e) {
      if (!args.p_ver) throw e;
      if (/p_ver|painel_vivo/.test(e.message)) {
        verErro = "Falta rodar a migração 06/11b (traçado) no Supabase.";   // painel_vivo antigo, sem p_ver
        v = await rpc("painel_vivo", { p_token: token });
      } else if (/sinal desconhecido/.test(e.message) && verFontes.length > 1) {
        verErro = "Para ver dois sinais juntos, falta rodar a migração 06/11c no Supabase.";   // só a 06b: um sinal
        v = await rpc("painel_vivo", { p_token: token, p_ver: verFontes[0] });
      } else throw e;
    }
    if (!verFontes.length) { v.tracado = null; v.tracados = []; }
    Object.assign(dados, v);
    falhas = 0; desenhar(false);
  } catch (e) {
    if (/painel_vivo/.test(e.message)) { semVivo = true; return atualizar(); }   // migração de 06/11 ainda não rodada
    if (falhou(e)) return;
  }
  agendar();
}

function iniciar() { esqueleto(); atualizar(); }

if (SUPABASE_URL.includes("COLE_AQUI") || CHAVE_PUBLICA.includes("COLE_AQUI")) {
  app.innerHTML = `<div class="token cartao"><h2 style="margin-top:0">Falta configurar</h2>
    <div class="msg">Abra este arquivo num editor de texto e preencha <b>SUPABASE_URL</b> e <b>CHAVE_PUBLICA</b> (os mesmos do ConfigNuvem.java do app).</div></div>`;
} else {
  token = lerToken();
  token ? iniciar() : telaToken();
}
</script>
